# Entorno de DESARROLLO de Gestión de Activos.
# MySQL y Keycloak NO están aquí: corren aparte en Docker Desktop
# y el backend los alcanza a través de host.docker.internal.

services:
  backend:
    build:
      context: ./gestion-activos-api
      dockerfile: Dockerfile
    container_name: gestion-activos-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      # Los valores vienen del archivo .env junto a este compose.
      # ${VAR:?msg} detiene el arranque si la variable falta, en vez de conectar con valores vacíos.
      DATABASE_URL: "mysql://${DB_USER:?Falta DB_USER en .env}:${DB_PASSWORD:?Falta DB_PASSWORD en .env}@${DB_HOST:?Falta DB_HOST en .env}:${DB_PORT:-3306}/${DB_NAME:?Falta DB_NAME en .env}"
      CORS_ORIGINS: "${CORS_ORIGINS:?Falta CORS_ORIGINS en .env}"
      KEYCLOAK_URL: "${KEYCLOAK_URL:?Falta KEYCLOAK_URL en .env}"
      KEYCLOAK_REALM: "${KEYCLOAK_REALM:?Falta KEYCLOAK_REALM en .env}"
      KEYCLOAK_ISSUER: "${KEYCLOAK_ISSUER:?Falta KEYCLOAK_ISSUER en .env}"
      KEYCLOAK_AUDIENCE: "${KEYCLOAK_AUDIENCE:?Falta KEYCLOAK_AUDIENCE en .env}"
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:?Falta KEYCLOAK_ADMIN en .env}"
      KEYCLOAK_PASSWORD: "${KEYCLOAK_PASSWORD:?Falta KEYCLOAK_PASSWORD en .env}"
      # En Windows los cambios de archivos no llegan al contenedor como eventos;
      # forzamos a TypeScript (nest start --watch) a detectarlos por sondeo.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling
    volumes:
      - ./gestion-activos-api:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Perfil "glpi" (opcional) ───────────────────────────────────────────────
  # Nada de esto arranca con un `docker compose up` normal. Para levantarlo:
  #   docker compose --profile glpi up -d
  #
  # GLPI local de pruebas, con su PROPIA base de datos (no toca la principal).
  # Web: http://localhost:8081 (el 8080 es de Keycloak). Primer acceso: glpi / glpi.
  glpi-db:
    profiles: ["glpi"]
    image: mysql:8.4
    container_name: gestion-activos-glpi-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${GLPI_DB_NAME:-glpi}"
      MYSQL_USER: "${GLPI_DB_USER:-glpi}"
      MYSQL_PASSWORD: "${GLPI_DB_PASSWORD:-glpi_local}"
      MYSQL_ROOT_PASSWORD: "${GLPI_DB_ROOT_PASSWORD:-glpi_root_local}"
    volumes:
      - glpi_db_data:/var/lib/mysql
    # Sin puerto publicado: solo GLPI la alcanza, por la red interna de Docker. Por eso
    # las contraseñas tienen un valor por defecto local; cámbialas en .env si quieres.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  glpi:
    profiles: ["glpi"]
    # Imagen oficial. Fija aquí la MISMA versión que usa la empresa (p. ej. glpi/glpi:11.0.1).
    image: glpi/glpi:latest
    container_name: gestion-activos-glpi
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      # Con estas variables GLPI se instala solo en el primer arranque (tarda unos minutos).
      GLPI_DB_HOST: glpi-db
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: "${GLPI_DB_NAME:-glpi}"
      GLPI_DB_USER: "${GLPI_DB_USER:-glpi}"
      GLPI_DB_PASSWORD: "${GLPI_DB_PASSWORD:-glpi_local}"
    volumes:
      - glpi_data:/var/glpi
    depends_on:
      glpi-db:
        condition: service_healthy

  # Worker de sincronización con GLPI (node-cron). Proceso aparte de la API:
  # misma imagen, otro comando.
  #
  # La conexión con GLPI (URL, cliente OAuth, usuario, zona horaria, tipos…) se
  # define en UN solo sitio: gestion-activos-api/.env. Lo leen igual este worker,
  # la API (botón "Sincronizar con GLPI") y los comandos de consola. Aquí solo
  # se decide cómo trabaja el worker.
  glpi-sync:
    profiles: ["glpi"]
    build:
      context: ./gestion-activos-api
      dockerfile: Dockerfile
    container_name: gestion-activos-glpi-sync
    command: ["npm", "run", "glpi:worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql://${DB_USER:?Falta DB_USER en .env}:${DB_PASSWORD:?Falta DB_PASSWORD en .env}@${DB_HOST:?Falta DB_HOST en .env}:${DB_PORT:-3306}/${DB_NAME:?Falta DB_NAME en .env}"
      # Seguro por defecto: simulación. Solo "false" escribe en la base
      # (antes: respaldo verificado y simulación revisada; ver docs/glpi-sync.md).
      GLPI_DRY_RUN: "${GLPI_DRY_RUN:-true}"
      # Cada ejecución es incremental (solo lo modificado en GLPI): puede ser frecuente.
      GLPI_SYNC_CRON: "${GLPI_SYNC_CRON:-*/15 * * * *}"
      # Cada cuántas horas se hace la lectura completa que detecta bajas.
      GLPI_RECONCILIACION_HORAS: "${GLPI_RECONCILIACION_HORAS:-24}"
      # Minutos que se retrocede desde el punto de control en cada consulta incremental.
      GLPI_VENTANA_SEGURIDAD_MIN: "${GLPI_VENTANA_SEGURIDAD_MIN:-15}"
      # El cron se evalúa en la hora del contenedor.
      TZ: "${GLPI_WORKER_TZ:-America/Guayaquil}"
    volumes:
      - ./gestion-activos-api:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: nginx:alpine
    container_name: gestion-activos-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  # Datos del GLPI local de pruebas (perfil "glpi").
  glpi_db_data:
  glpi_data:
